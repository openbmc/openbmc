# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# This layer only carries machine configuration and templates, so it has no
# recipes of its own. Declare the pattern empty and allow it, the same way
# meta-evb does upstream.
BBFILE_COLLECTIONS += "frdm-imx93"
BBFILE_PATTERN_frdm-imx93 = ""
BBFILE_PATTERN_IGNORE_EMPTY_frdm-imx93 = "1"
LAYERSERIES_COMPAT_frdm-imx93 = "blacksail wrynose"
