KMACHINE = "aspeed"
# Switch to the MGX Vera C2 kernel DTS once it lands upstream.
KERNEL_DEVICETREE = "aspeed/${KMACHINE}-ast2600-evb.dtb"

UBOOT_MACHINE = "ast2600_openbmc_spl_defconfig"
UBOOT_DEVICETREE = "ast2600-vr-bmc-nvidia"
SPL_BINARY = "spl/u-boot-spl.bin"

require conf/machine/include/ast2600.inc
require conf/machine/include/obmc-bsp-common.inc
require conf/distro/include/pldm.inc
require conf/machine/include/nvidia.inc

# Standard 64MB flash layout (openbmc-flash-layout-64).
FLASH_SIZE = "65536"
SOCSEC_SIGN_ENABLE = "0"

IMAGE_FEATURES:remove = " \
    obmc-chassis-mgmt \
    obmc-chassis-state-mgmt \
    obmc-fan-control \
    obmc-fan-mgmt \
    obmc-flash-mgmt \
    obmc-host-state-mgmt \
"
