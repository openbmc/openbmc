# Arch / platform
CONFIG_ARCH_MULTI_V7=y

# SCSI / Block
CONFIG_CHR_DEV_SG=y

# Filesystem
CONFIG_MSDOS_FS=y
CONFIG_FAT_DEFAULT_UTF8=y

# Networking
CONFIG_NET_SCHED=y
CONFIG_IP_PNP=y

# MCTP
CONFIG_MCTP=y
CONFIG_MCTP_FLOWS=y
CONFIG_MCTP_TRANSPORT_I2C=y
CONFIG_MCTP_TRANSPORT_USB=y

# USB
CONFIG_USB_UHCI_HCD=y
CONFIG_USB_MON=y
CONFIG_USB_HIDDEV=y
CONFIG_USB_ACM=y
CONFIG_USB_NET_DRIVERS=y
CONFIG_USB_USBNET=y
CONFIG_USB_NET_CDCETHER=y
CONFIG_USB_NET_CDC_NCM=y
CONFIG_USB_NET_CDC_SUBSET_ENABLE=y
CONFIG_USB_NET_CDC_SUBSET=y
CONFIG_USB_ETH=y
CONFIG_USB_F_RNDIS=y
CONFIG_USB_CONFIGFS_RNDIS=y
CONFIG_USB_ETH_RNDIS=y
CONFIG_USB_F_ECM=y
CONFIG_USB_SERIAL=y
CONFIG_USB_SERIAL_GENERIC=y
CONFIG_USB_SERIAL_FTDI_SIO=y
CONFIG_USB_SERIAL_CP210X=y

# HID / CP2112
CONFIG_HID=y
CONFIG_USB_HID=y
CONFIG_HIDRAW=y
CONFIG_HID_CP2112=y

# I2C
CONFIG_I2C_SMBUS=y

# GPIO / regulator
CONFIG_GPIO_ASPEED_SGPIO=y
CONFIG_REGULATOR=y
CONFIG_REGULATOR_FIXED_VOLTAGE=y

# PHY
CONFIG_FIXED_PHY=y

# Sensors
CONFIG_SENSORS_MAX31790=y

# Misc
CONFIG_PSTORE=y
CONFIG_PSTORE_RAM=y
CONFIG_DEVMEM=y
CONFIG_HW_RANDOM=y
